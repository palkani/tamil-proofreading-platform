<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="navyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Main Text - No spacing -->
  <g transform="translate(50, 100)">
    <!-- "Proof" in English - elegant serif font -->
    <text x="0" y="0" 
          font-family="'Playfair Display', 'Georgia', 'Times New Roman', serif" 
          font-size="90" 
          font-weight="700" 
          fill="url(#navyGradient)" 
          letter-spacing="3"
          filter="url(#shadow)">Proof</text>
    
    <!-- "தமிழ்" (Tamil) in Tamil script - immediately next to Proof -->
    <text x="312" y="0" 
          font-family="'Lohit Tamil', 'Tamil MN', 'Noto Sans Tamil', sans-serif" 
          font-size="90" 
          font-weight="700" 
          fill="#1e3a8a"
          filter="url(#shadow)">தமிழ்</text>
  </g>
  
  <!-- Elegant decorative flourish underneath with ornamental curves -->
  <g>
    <!-- Main elegant curve -->
    <path d="M 50 130 Q 100 125 150 130 T 250 130 Q 300 135 350 130" 
          stroke="url(#accentGradient)" 
          stroke-width="2.5" 
          fill="none" 
          opacity="0.8"
          stroke-linecap="round"/>
    
    <!-- Decorative swirls on ends -->
    <path d="M 50 130 Q 45 125 50 120" 
          stroke="#3b82f6" 
          stroke-width="2" 
          fill="none" 
          opacity="0.6"
          stroke-linecap="round"/>
    <path d="M 350 130 Q 355 125 350 120" 
          stroke="#1e3a8a" 
          stroke-width="2" 
          fill="none" 
          opacity="0.6"
          stroke-linecap="round"/>
    
    <!-- Small accent flourish in center -->
    <circle cx="200" cy="130" r="2.5" fill="#3b82f6" opacity="0.7"/>
    <path d="M 195 130 L 205 130" 
          stroke="#3b82f6" 
          stroke-width="1.5" 
          opacity="0.5"/>
  </g>
  
  <!-- Small decorative accent dots -->
  <circle cx="50" cy="80" r="4" fill="#3b82f6" opacity="0.6"/>
  <circle cx="550" cy="80" r="4" fill="#1e3a8a" opacity="0.6"/>
</svg>

