<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 148" role="img" aria-label="ProofTamil - Tamil AI Proofreading"
     text-rendering="optimizeLegibility" shape-rendering="geometricPrecision">
  <title>ProofTamil</title>
  <defs>
    <!-- Icon: indigo gradient -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#818CF8"/>
      <stop offset="45%"  stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <!-- Gloss layer -->
    <linearGradient id="iconGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- "Proof" wordmark gradient -->
    <linearGradient id="proofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <!-- Drop shadow -->
    <filter id="iconShadow" x="-14%" y="-10%" width="132%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#4F46E5" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- ── Icon: Rounded square ── -->
  <rect x="4" y="4" width="138" height="138" rx="28" ry="28"
        fill="url(#iconGrad)" filter="url(#iconShadow)"/>
  <!-- Gloss highlight (top half only) -->
  <rect x="4" y="4" width="138" height="70" rx="28" ry="28"
        fill="url(#iconGloss)"/>

  <!-- Tamil "த" centred inside icon -->
  <text x="73" y="106"
    font-family="'Noto Serif Tamil', 'Tamil MN', 'Latha', 'Vijaya', serif"
    font-size="84"
    font-weight="700"
    text-anchor="middle"
    fill="white"
    opacity="0.97">த</text>

  <!-- Amber accent bar at bottom of icon -->
  <rect x="26" y="124" width="94" height="8" rx="4" fill="#F59E0B"/>

  <!-- ── Wordmark: single <text> with two <tspan> so they flow tight ── -->
  <text x="162" y="102"
    font-size="70"
    font-weight="800"
    text-anchor="start"
    dominant-baseline="auto">
    <!-- "Proof" in deep indigo -->
    <tspan
      font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif"
      fill="url(#proofGrad)"
      letter-spacing="-2">Proof</tspan><!--
    --><tspan
      font-family="'Noto Serif Tamil', 'Tamil MN', 'Latha', 'Vijaya', serif"
      fill="#F59E0B"
      dx="2"
      letter-spacing="0">தமிழ்</tspan>
  </text>

  <!-- Thin amber underline spanning the full wordmark -->
  <rect x="162" y="116" width="508" height="3.5" rx="2" fill="#F59E0B" opacity="0.25"/>
</svg>
