<svg viewBox="0 0 30000 10000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="navyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow">
      <feDropShadow dx="0" dy="150" stdDeviation="200" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Main Text - No spacing -->
  <g transform="translate(2500, 5000)">
    <!-- "Proof" in English - elegant serif font -->
    <text x="0" y="0" 
          font-family="'Playfair Display', 'Georgia', 'Times New Roman', serif" 
          font-size="4500" 
          font-weight="700" 
          fill="url(#navyGradient)" 
          letter-spacing="150"
          filter="url(#shadow)">Proof</text>
    
    <!-- "தமிழ்" (Tamil) in Tamil script - immediately next to Proof -->
    <text x="15600" y="0" 
          font-family="'Lohit Tamil', 'Tamil MN', 'Noto Sans Tamil', sans-serif" 
          font-size="4500" 
          font-weight="700" 
          fill="#1e3a8a"
          filter="url(#shadow)">தமிழ்</text>
  </g>
  
  <!-- Elegant decorative flourish underneath with ornamental curves -->
  <g>
    <!-- Main elegant curve -->
    <path d="M 2500 6500 Q 5000 6250 7500 6500 T 12500 6500 Q 15000 6750 17500 6500" 
          stroke="url(#accentGradient)" 
          stroke-width="125" 
          fill="none" 
          opacity="0.8"
          stroke-linecap="round"/>
    
    <!-- Decorative swirls on ends -->
    <path d="M 2500 6500 Q 2250 6250 2500 6000" 
          stroke="#3b82f6" 
          stroke-width="100" 
          fill="none" 
          opacity="0.6"
          stroke-linecap="round"/>
    <path d="M 17500 6500 Q 17750 6250 17500 6000" 
          stroke="#1e3a8a" 
          stroke-width="100" 
          fill="none" 
          opacity="0.6"
          stroke-linecap="round"/>
    
    <!-- Small accent flourish in center -->
    <circle cx="10000" cy="6500" r="125" fill="#3b82f6" opacity="0.7"/>
    <path d="M 9750 6500 L 10250 6500" 
          stroke="#3b82f6" 
          stroke-width="75" 
          opacity="0.5"/>
  </g>
  
  <!-- Small decorative accent dots -->
  <circle cx="2500" cy="4000" r="200" fill="#3b82f6" opacity="0.6"/>
  <circle cx="27500" cy="4000" r="200" fill="#1e3a8a" opacity="0.6"/>
</svg>
