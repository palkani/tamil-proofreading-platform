<svg width="3000" height="1000" viewBox="0 0 3000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="navyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Main Text - No spacing -->
  <g transform="translate(250, 500)">
    <!-- "Proof" in English - elegant serif font -->
    <text x="0" y="0" 
          font-family="'Playfair Display', 'Georgia', 'Times New Roman', serif" 
          font-size="450" 
          font-weight="700" 
          fill="url(#navyGradient)" 
          letter-spacing="15"
          filter="url(#shadow)">Proof</text>
    
    <!-- "தமிழ்" (Tamil) in Tamil script - immediately next to Proof -->
    <text x="1560" y="0" 
          font-family="'Lohit Tamil', 'Tamil MN', 'Noto Sans Tamil', sans-serif" 
          font-size="450" 
          font-weight="700" 
          fill="#1e3a8a"
          filter="url(#shadow)">தமிழ்</text>
  </g>
  
  <!-- Elegant decorative flourish underneath with ornamental curves -->
  <g>
    <!-- Main elegant curve -->
    <path d="M 250 650 Q 500 625 750 650 T 1250 650 Q 1500 675 1750 650" 
          stroke="url(#accentGradient)" 
          stroke-width="12.5" 
          fill="none" 
          opacity="0.8"
          stroke-linecap="round"/>
    
    <!-- Decorative swirls on ends -->
    <path d="M 250 650 Q 225 625 250 600" 
          stroke="#3b82f6" 
          stroke-width="10" 
          fill="none" 
          opacity="0.6"
          stroke-linecap="round"/>
    <path d="M 1750 650 Q 1775 625 1750 600" 
          stroke="#1e3a8a" 
          stroke-width="10" 
          fill="none" 
          opacity="0.6"
          stroke-linecap="round"/>
    
    <!-- Small accent flourish in center -->
    <circle cx="1000" cy="650" r="12.5" fill="#3b82f6" opacity="0.7"/>
    <path d="M 975 650 L 1025 650" 
          stroke="#3b82f6" 
          stroke-width="7.5" 
          opacity="0.5"/>
  </g>
  
  <!-- Small decorative accent dots -->
  <circle cx="250" cy="400" r="20" fill="#3b82f6" opacity="0.6"/>
  <circle cx="2750" cy="400" r="20" fill="#1e3a8a" opacity="0.6"/>
</svg>
