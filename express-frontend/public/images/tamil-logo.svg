<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 162" role="img" aria-label="Proof தமிழ் Logo">
  <title>Proof தமிழ்</title>
  <defs>
    <!-- Shield gradient: bright cyan-blue top → deep blue bottom -->
    <linearGradient id="shieldGrad" x1="25%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="45%" stop-color="#38a3f5"/>
      <stop offset="100%" stop-color="#1a4fd8"/>
    </linearGradient>
    <!-- Left-edge darkening for 3-D depth -->
    <linearGradient id="shieldEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0c30a0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0c30a0" stop-opacity="0"/>
    </linearGradient>
    <!-- Subtle drop shadow for shield -->
    <filter id="shieldShadow" x="-8%" y="-6%" width="120%" height="120%">
      <feDropShadow dx="3" dy="4" stdDeviation="5" flood-color="#1a4fd8" flood-opacity="0.35"/>
    </filter>
    <!-- "Proof" text gradient: light→medium blue -->
    <linearGradient id="proofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5eb4f0"/>
      <stop offset="100%" stop-color="#2876d4"/>
    </linearGradient>
  </defs>

  <!-- ── Shield body ── -->
  <!--
    Classic security badge shape:
    - Rounded top (gentle arc)
    - Straight sides tapering inward
    - Pointed bottom
  -->
  <path d="
    M 78 6
    C 55 6, 14 18, 10 22
    L 10 82
    C 10 122, 78 154, 78 154
    C 78 154, 146 122, 146 82
    L 146 22
    C 142 18, 101 6, 78 6 Z"
    fill="url(#shieldGrad)"
    filter="url(#shieldShadow)"/>

  <!-- Left-edge shadow stripe for 3-D effect -->
  <path d="
    M 78 6
    C 55 6, 14 18, 10 22
    L 10 82
    C 10 122, 78 154, 78 154"
    fill="url(#shieldEdge)"
    opacity="1"/>

  <!-- Inner highlight ring (top rim, white glow) -->
  <path d="
    M 78 12
    C 58 12, 20 22, 17 26
    L 17 80
    C 17 116, 78 146, 78 146
    C 78 146, 139 116, 139 80
    L 139 26
    C 136 22, 98 12, 78 12 Z"
    fill="none"
    stroke="rgba(255,255,255,0.18)"
    stroke-width="3"/>

  <!-- ── Checkmark ── -->
  <path d="M 35 80 L 63 108 L 122 52"
    fill="none"
    stroke="white"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- ── "Proof" text ── -->
  <text x="168" y="118"
    font-family="'Georgia', 'Palatino Linotype', 'Book Antiqua', 'Times New Roman', serif"
    font-size="82"
    font-weight="700"
    fill="url(#proofGrad)"
    letter-spacing="-1">Proof</text>

  <!-- ── "தமிழ்" text ── -->
  <text x="354" y="118"
    font-family="'Noto Serif Tamil', 'Latha', 'Tamil MN', 'Vijaya', 'Noto Sans Tamil', serif"
    font-size="82"
    font-weight="700"
    fill="#1a2f72">தமிழ்</text>
</svg>
