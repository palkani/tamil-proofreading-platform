<svg viewBox="0 0 1800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="navyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Main Text - No spacing -->
  <g transform="translate(150, 300)">
    <!-- "Proof" in English - elegant serif font -->
    <text x="0" y="0" 
          font-family="'Playfair Display', 'Georgia', 'Times New Roman', serif" 
          font-size="270" 
          font-weight="700" 
          fill="url(#navyGradient)" 
          letter-spacing="9"
          filter="url(#shadow)">Proof</text>
    
    <!-- "தமிழ்" (Tamil) in Tamil script - immediately next to Proof -->
    <text x="936" y="0" 
          font-family="'Lohit Tamil', 'Tamil MN', 'Noto Sans Tamil', sans-serif" 
          font-size="270" 
          font-weight="700" 
          fill="#1e3a8a"
          filter="url(#shadow)">தமிழ்</text>
  </g>
  
  <!-- Elegant decorative flourish underneath with ornamental curves -->
  <g>
    <!-- Main elegant curve -->
    <path d="M 150 390 Q 300 375 450 390 T 750 390 Q 900 405 1050 390" 
          stroke="url(#accentGradient)" 
          stroke-width="7.5" 
          fill="none" 
          opacity="0.8"
          stroke-linecap="round"/>
    
    <!-- Decorative swirls on ends -->
    <path d="M 150 390 Q 135 375 150 360" 
          stroke="#3b82f6" 
          stroke-width="6" 
          fill="none" 
          opacity="0.6"
          stroke-linecap="round"/>
    <path d="M 1050 390 Q 1065 375 1050 360" 
          stroke="#1e3a8a" 
          stroke-width="6" 
          fill="none" 
          opacity="0.6"
          stroke-linecap="round"/>
    
    <!-- Small accent flourish in center -->
    <circle cx="600" cy="390" r="7.5" fill="#3b82f6" opacity="0.7"/>
    <path d="M 585 390 L 615 390" 
          stroke="#3b82f6" 
          stroke-width="4.5" 
          opacity="0.5"/>
  </g>
  
  <!-- Small decorative accent dots -->
  <circle cx="150" cy="240" r="12" fill="#3b82f6" opacity="0.6"/>
  <circle cx="1650" cy="240" r="12" fill="#1e3a8a" opacity="0.6"/>
</svg>
