<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 155" role="img" aria-label="ProofTamil - Tamil AI Proofreading"
     text-rendering="optimizeLegibility" shape-rendering="geometricPrecision">
  <title>ProofTamil</title>
  <defs>
    <!-- Icon: indigo gradient (top-left bright → bottom-right deep) -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#6366F1"/>
      <stop offset="55%"  stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <!-- Icon inner top highlight (gloss) -->
    <linearGradient id="iconGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- "Proof" text: indigo gradient -->
    <linearGradient id="proofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <!-- Soft drop shadow for icon -->
    <filter id="iconShadow" x="-12%" y="-8%" width="130%" height="128%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#4F46E5" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- ── Icon: Rounded square ── -->
  <rect x="5" y="5" width="144" height="144" rx="30" ry="30"
        fill="url(#iconGrad)" filter="url(#iconShadow)"/>
  <!-- Gloss layer (top half) -->
  <rect x="5" y="5" width="144" height="72" rx="30" ry="30"
        fill="url(#iconGloss)"/>

  <!-- Tamil letter "த" centred inside icon (white) -->
  <text x="77" y="114"
    font-family="'Noto Serif Tamil', 'Tamil MN', 'Latha', 'Vijaya', serif"
    font-size="88"
    font-weight="700"
    text-anchor="middle"
    fill="white"
    opacity="0.96">த</text>

  <!-- Amber accent bar — bottom of icon -->
  <rect x="28" y="130" width="98" height="9" rx="4.5" fill="#F59E0B"/>

  <!-- ── Wordmark: "Proof" ── -->
  <text x="174" y="108"
    font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif"
    font-size="76"
    font-weight="800"
    fill="url(#proofGrad)"
    letter-spacing="-2">Proof</text>

  <!-- ── Wordmark: "தமிழ்" in saffron amber ── -->
  <text x="414" y="108"
    font-family="'Noto Serif Tamil', 'Tamil MN', 'Latha', 'Vijaya', 'Noto Sans Tamil', serif"
    font-size="76"
    font-weight="700"
    fill="#F59E0B">தமிழ்</text>
</svg>
