# Deploy backend to Fly.io (app: tamil-api from fly.toml).
# Requires: GitHub secret FLY_API_TOKEN (create with: fly tokens create deploy -x 999999h)
# Ensure the Fly app exists: fly launch --no-deploy (or fly apps create tamil-api)

name: Deploy to Fly.io

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'fly.toml'
      - '.github/workflows/deploy-fly.yml'
  workflow_dispatch:

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  deploy:
    name: Deploy backend to Fly
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-fly
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify deployment
        run: |
          flyctl status --app tamil-api --config fly.toml
          echo "Health: https://tamil-api.fly.dev/health"
