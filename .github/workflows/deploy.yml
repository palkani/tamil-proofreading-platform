# UI (Node.js) → Vercel | OAuth & DB → Supabase | Backend (Go) → Cloud Run
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL - Postgres connection string (Supabase pooler) for Cloud Run
#   GOOGLE_CREDENTIALS_JSON, VERCEL_*, GOOGLE_GENAI_API_KEY, OPENAI_API_KEY, etc.

name: Deploy to Cloud Run + Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: prooftamil
  REGION: asia-south1
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  GOOGLE_OAUTH_REDIRECT_DOMAIN: https://prooftamil.com
  NEXT_PUBLIC_TRANSLITERATOR_BASE_URL: ${{ secrets.NEXT_PUBLIC_TRANSLITERATOR_BASE_URL }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Go build precheck (fail fast)
        working-directory: backend
        run: |
          go env
          go version
          go mod tidy
          go mod verify
          CGO_ENABLED=0 GOOS=linux go build ./cmd/server

      - name: Build Backend Image
        run: |
          docker build \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/docker-repo/backend:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/docker-repo/backend:latest \
            -f backend/Dockerfile \
            .

      - name: Push Backend Image
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/docker-repo/backend:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/docker-repo/backend:latest

      - name: Deploy Backend to Cloud Run
        run: |
          gcloud run deploy prooftamil-backend \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/docker-repo/backend:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --memory=2Gi \
            --cpu=1 \
            --timeout=300 \
            --min-instances=0 \
            --max-instances=100 \
            --port=8080 \
            --set-env-vars=GIN_MODE=release,GOOGLE_OAUTH_REDIRECT_DOMAIN=${{ env.GOOGLE_OAUTH_REDIRECT_DOMAIN }},SUPABASE_URL=https://cnyrqookmazccatnwvkf.supabase.co,SUGGEST_MIN_LEN=1,SUGGEST_TOP_K=5,SUGGEST_CACHE_ENTRIES=200,SUGGEST_CACHE_TTL_MS=120000,SUGGEST_VOWEL_COLLAPSE=false,SUGGEST_USE_DB=true,RUN_MIGRATIONS=false,REDIS_URL=${{ secrets.REDIS_URL }} \
            --update-secrets DATABASE_URL=DATABASE_URL:latest \
            --update-secrets GOOGLE_GENAI_API_KEY=GOOGLE_GENAI_API_KEY:latest \
            --update-secrets OPENAI_API_KEY=OPENAI_API_KEY:latest \
            --update-secrets GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest \
            --update-secrets GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest \
            --update-secrets JWT_SECRET=JWT_SECRET:latest

      - name: Deploy Backend to Cloud Run (US Region)
        run: |
          docker tag ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/docker-repo/backend:${{ github.sha }} \
            us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/docker-repo/backend:${{ github.sha }}
          docker push us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/docker-repo/backend:${{ github.sha }} || echo "US push skipped - registry may not exist"

          gcloud run deploy prooftamil-backend-us \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/docker-repo/backend:${{ github.sha }} \
            --region=us-central1 \
            --platform=managed \
            --allow-unauthenticated \
            --memory=2Gi \
            --cpu=2 \
            --timeout=300 \
            --min-instances=0 \
            --max-instances=100 \
            --port=8080 \
            --set-env-vars=GIN_MODE=release,GOOGLE_OAUTH_REDIRECT_DOMAIN=${{ env.GOOGLE_OAUTH_REDIRECT_DOMAIN }},SUPABASE_URL=https://cnyrqookmazccatnwvkf.supabase.co,SUGGEST_MIN_LEN=1,SUGGEST_TOP_K=5,SUGGEST_CACHE_ENTRIES=200,SUGGEST_CACHE_TTL_MS=120000,SUGGEST_VOWEL_COLLAPSE=false,SUGGEST_USE_DB=true,RUN_MIGRATIONS=false,REDIS_URL=${{ secrets.REDIS_URL }} \
            --update-secrets DATABASE_URL=DATABASE_URL:latest \
            --update-secrets GOOGLE_GENAI_API_KEY=GOOGLE_GENAI_API_KEY:latest \
            --update-secrets OPENAI_API_KEY=OPENAI_API_KEY:latest \
            --update-secrets GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest \
            --update-secrets GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest \
            --update-secrets JWT_SECRET=JWT_SECRET:latest || echo "US deployment skipped - may need setup"

      - name: Verify Backend Health (Both Regions)
        run: |
          sleep 10
          echo "=== Asia South (Mumbai) ==="
          BACKEND_URL=$(gcloud run services describe prooftamil-backend --region=${{ env.REGION }} --format='value(status.url)')
          echo "Backend URL: $BACKEND_URL"
          curl -f "$BACKEND_URL/health" || echo "Health check pending..."

          echo ""
          echo "=== US Central ==="
          BACKEND_URL_US=$(gcloud run services describe prooftamil-backend-us --region=us-central1 --format='value(status.url)' 2>/dev/null) || echo "US backend not yet deployed"
          if [ -n "$BACKEND_URL_US" ]; then
            echo "Backend URL (US): $BACKEND_URL_US"
            curl -f "$BACKEND_URL_US/health" || echo "US health check pending..."
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: express-frontend
        run: |
          npm config set registry https://registry.npmjs.org
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-timeout 600000
          for i in 1 2 3; do
            npm ci && break
            echo "npm ci failed (attempt $i), retrying in 10s..."
            sleep 10
          done
          npm list tailwindcss || npm install tailwindcss

      - name: Build frontend assets
        working-directory: express-frontend
        run: npm run build:css

      - name: Check Vercel credentials
        run: |
          if [ -z "${VERCEL_TOKEN}" ] || [ -z "${VERCEL_ORG_ID}" ] || [ -z "${VERCEL_PROJECT_ID}" ]; then
            echo "Missing Vercel secrets. Ensure VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID are set in GitHub secrets."
            exit 1
          fi

      # Automatically sync the freshly-deployed Cloud Run URLs into Vercel's
      # production environment so the frontend always routes to the right backend.
      # Uses the Vercel REST API for reliable upsert (create-or-update) without
      # any interactive prompts.
      - name: Sync Cloud Run URLs to Vercel environment
        run: |
          ASIA_URL=$(gcloud run services describe prooftamil-backend \
            --region=asia-south1 --format='value(status.url)')
          US_URL=$(gcloud run services describe prooftamil-backend-us \
            --region=us-central1 --format='value(status.url)' 2>/dev/null || echo "")

          echo "Asia backend: $ASIA_URL"
          echo "US backend:   ${US_URL:-not deployed}"

          if [ -z "$ASIA_URL" ]; then
            echo "ERROR: Asia backend URL not found after deployment"
            exit 1
          fi

          API="https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env"
          TEAM="teamId=${VERCEL_ORG_ID}"
          AUTH="Authorization: Bearer ${VERCEL_TOKEN}"

          # Find existing env var ID for a key + production target.
          # Uses jq with a safe guard — handles target as array or string.
          find_env_id() {
            local KEY="$1"
            curl -s "${API}?${TEAM}" -H "$AUTH" | \
              jq -r --arg k "$KEY" '
                .envs[]?
                | select(.key == $k)
                | select(
                    if (.target | type) == "array"
                    then (.target | index("production")) != null
                    else .target == "production"
                    end
                  )
                | .id' | head -1
          }

          # Upsert a Vercel production env var: update if exists, create if not.
          # Shows the API response body on any non-2xx so failures are diagnosable.
          upsert_env() {
            local KEY="$1" VALUE="$2"

            local EXISTING_ID
            EXISTING_ID=$(find_env_id "$KEY")

            local BODY CODE

            if [ -n "$EXISTING_ID" ] && [ "$EXISTING_ID" != "null" ]; then
              echo "  Updating $KEY (id: $EXISTING_ID)"
              BODY=$(curl -s -w "\n%{http_code}" -X PATCH \
                "${API}/${EXISTING_ID}?${TEAM}" \
                -H "$AUTH" -H "Content-Type: application/json" \
                -d "{\"value\":\"${VALUE}\",\"type\":\"plain\",\"target\":[\"production\"]}")
              CODE=$(printf '%s' "$BODY" | tail -1)
              if ! [[ "$CODE" =~ ^2 ]]; then
                echo "  ERROR: PATCH returned HTTP $CODE for $KEY"
                printf '%s\n' "$BODY" | head -1
                exit 1
              fi
              echo "  Done: $KEY updated"
            else
              echo "  Creating $KEY"
              BODY=$(curl -s -w "\n%{http_code}" -X POST \
                "${API}?${TEAM}" \
                -H "$AUTH" -H "Content-Type: application/json" \
                -d "{\"key\":\"${KEY}\",\"value\":\"${VALUE}\",\"type\":\"plain\",\"target\":[\"production\"]}")
              CODE=$(printf '%s' "$BODY" | tail -1)

              # 409 = env var already exists in a different target combination.
              # Recover by finding the ID and patching it.
              if [ "$CODE" = "409" ]; then
                echo "  409 conflict — looking up existing ID for $KEY"
                EXISTING_ID=$(curl -s "${API}?${TEAM}" -H "$AUTH" | \
                  jq -r --arg k "$KEY" '.envs[]? | select(.key == $k) | .id' | head -1)
                if [ -n "$EXISTING_ID" ]; then
                  curl -s -X PATCH \
                    "${API}/${EXISTING_ID}?${TEAM}" \
                    -H "$AUTH" -H "Content-Type: application/json" \
                    -d "{\"value\":\"${VALUE}\",\"type\":\"plain\",\"target\":[\"production\"]}" > /dev/null
                  echo "  Done: $KEY updated (409 recovery)"
                else
                  echo "  ERROR: 409 but could not find existing ID for $KEY"
                  exit 1
                fi
              elif ! [[ "$CODE" =~ ^2 ]]; then
                echo "  ERROR: POST returned HTTP $CODE for $KEY"
                printf '%s\n' "$BODY" | head -1
                exit 1
              else
                echo "  Done: $KEY created"
              fi
            fi
          }

          upsert_env BACKEND_URL_ASIA "$ASIA_URL"

          if [ -n "$US_URL" ]; then
            upsert_env BACKEND_URL_US      "$US_URL"
            # BACKEND_URL_PRIMARY is the fixed OAuth callback URL — always US.
            upsert_env BACKEND_URL_PRIMARY "$US_URL"
          fi

          echo "Vercel env vars synced."
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Frontend to Vercel
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel deploy --prod --token=$VERCEL_TOKEN --yes --force
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deployment Complete
        run: |
          echo "Deployment Complete"
          echo "Backend (Cloud Run): $(gcloud run services describe prooftamil-backend --region=${{ env.REGION }} --format='value(status.url)')"
          echo "Frontend: Deployed via Vercel"
