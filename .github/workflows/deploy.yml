# UI (Node.js) → Vercel | OAuth & DB → Supabase | Backend (Go) → Cloud Run
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL - Postgres connection string (Supabase pooler) for Cloud Run
#   GOOGLE_CREDENTIALS_JSON, VERCEL_*, GOOGLE_GENAI_API_KEY, OPENAI_API_KEY, etc.
#   SMTP_PASSWORD   - Zoho Mail password (or App Password if 2FA is on) for contact emails
#   RESEND_API_KEY  - (Recommended) Resend API key — used instead of SMTP for contact emails
#
# Google Secret Manager (pulled into Cloud Run via --update-secrets):
#   DODO_PAYMENTS_API_KEY, DODO_PAYMENTS_WEBHOOK_SECRET, DODO_PRODUCT_ID_INDIA, DODO_PRODUCT_ID_GLOBAL
#   DATABASE_URL, GOOGLE_GENAI_API_KEY, OPENAI_API_KEY, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, JWT_SECRET

name: Deploy to Cloud Run + Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: prooftamil
  REGION: asia-south1
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  GOOGLE_OAUTH_REDIRECT_DOMAIN: https://prooftamil.com
  NEXT_PUBLIC_TRANSLITERATOR_BASE_URL: ${{ secrets.NEXT_PUBLIC_TRANSLITERATOR_BASE_URL }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Go build precheck (fail fast)
        working-directory: backend
        run: |
          go env
          go version
          go mod tidy
          go mod verify
          CGO_ENABLED=0 GOOS=linux go build ./cmd/server

      - name: Build Backend Image
        run: |
          docker build \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/docker-repo/backend:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/docker-repo/backend:latest \
            -f backend/Dockerfile \
            .

      - name: Push Backend Image
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/docker-repo/backend:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/docker-repo/backend:latest

      - name: Deploy Backend to Cloud Run
        run: |
          # Clear any pre-existing secret binding for SENDGRID_SMTP_PASSWORD so
          # the subsequent deploy can set it as a plain env var without a type conflict.
          gcloud run services update prooftamil-backend \
            --region=${{ env.REGION }} \
            --remove-secrets=SENDGRID_SMTP_PASSWORD 2>/dev/null || true

          gcloud run deploy prooftamil-backend \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/docker-repo/backend:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --memory=2Gi \
            --cpu=1 \
            --timeout=300 \
            --min-instances=1 \
            --max-instances=100 \
            --port=8080 \
            --set-env-vars=GIN_MODE=release,GOOGLE_OAUTH_REDIRECT_DOMAIN=${{ env.GOOGLE_OAUTH_REDIRECT_DOMAIN }},SUPABASE_URL=https://cnyrqookmazccatnwvkf.supabase.co,SUGGEST_MIN_LEN=1,SUGGEST_TOP_K=5,SUGGEST_CACHE_ENTRIES=200,SUGGEST_CACHE_TTL_MS=120000,SUGGEST_VOWEL_COLLAPSE=false,SUGGEST_USE_DB=true,RUN_MIGRATIONS=false,REDIS_URL=${{ secrets.REDIS_URL }},RESEND_API_KEY=${{ secrets.RESEND_API_KEY }},SENDGRID_SMTP_HOST=smtp.sendgrid.net,SENDGRID_SMTP_PORT=587,SENDGRID_SMTP_USER=apikey,SENDGRID_SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }},EMAIL_FROM_ADDRESS=contact@prooftamil.com,CONTACT_TO_EMAIL=contact@prooftamil.com,STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }},STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }},PAYMENTS_ENABLED=true,DODO_ENVIRONMENT=production,ADMIN_ALLOWED_EMAILS=contact@prooftamil.com \
            --update-secrets DATABASE_URL=DATABASE_URL:latest \
            --update-secrets GOOGLE_GENAI_API_KEY=GOOGLE_GENAI_API_KEY:latest \
            --update-secrets OPENAI_API_KEY=OPENAI_API_KEY:latest \
            --update-secrets GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest \
            --update-secrets GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest \
            --update-secrets JWT_SECRET=JWT_SECRET:latest \
            --update-secrets DODO_PAYMENTS_API_KEY=DODO_PAYMENTS_API_KEY:latest \
            --update-secrets DODO_PAYMENTS_WEBHOOK_SECRET=DODO_PAYMENTS_WEBHOOK_SECRET:latest \
            --update-secrets DODO_PRODUCT_ID_INDIA=DODO_PRODUCT_ID_INDIA:latest \
            --update-secrets DODO_PRODUCT_ID_GLOBAL=DODO_PRODUCT_ID_GLOBAL:latest

      - name: Deploy Backend to Cloud Run (US Region)
        run: |
          docker tag ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/docker-repo/backend:${{ github.sha }} \
            us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/docker-repo/backend:${{ github.sha }}
          docker push us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/docker-repo/backend:${{ github.sha }} || echo "US push skipped - registry may not exist"

          # Clear any pre-existing secret binding for SENDGRID_SMTP_PASSWORD.
          gcloud run services update prooftamil-backend-us \
            --region=us-central1 \
            --remove-secrets=SENDGRID_SMTP_PASSWORD 2>/dev/null || true

          gcloud run deploy prooftamil-backend-us \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/docker-repo/backend:${{ github.sha }} \
            --region=us-central1 \
            --platform=managed \
            --allow-unauthenticated \
            --memory=2Gi \
            --cpu=2 \
            --timeout=300 \
            --min-instances=1 \
            --max-instances=100 \
            --port=8080 \
            --set-env-vars=GIN_MODE=release,GOOGLE_OAUTH_REDIRECT_DOMAIN=${{ env.GOOGLE_OAUTH_REDIRECT_DOMAIN }},SUPABASE_URL=https://cnyrqookmazccatnwvkf.supabase.co,SUGGEST_MIN_LEN=1,SUGGEST_TOP_K=5,SUGGEST_CACHE_ENTRIES=200,SUGGEST_CACHE_TTL_MS=120000,SUGGEST_VOWEL_COLLAPSE=false,SUGGEST_USE_DB=true,RUN_MIGRATIONS=false,REDIS_URL=${{ secrets.REDIS_URL }},RESEND_API_KEY=${{ secrets.RESEND_API_KEY }},SENDGRID_SMTP_HOST=smtp.sendgrid.net,SENDGRID_SMTP_PORT=587,SENDGRID_SMTP_USER=apikey,SENDGRID_SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }},EMAIL_FROM_ADDRESS=contact@prooftamil.com,CONTACT_TO_EMAIL=contact@prooftamil.com,STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }},STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }},PAYMENTS_ENABLED=true,DODO_ENVIRONMENT=production,ADMIN_ALLOWED_EMAILS=contact@prooftamil.com,RECONCILIATION_ENABLED=true \
            --update-secrets DATABASE_URL=DATABASE_URL:latest \
            --update-secrets GOOGLE_GENAI_API_KEY=GOOGLE_GENAI_API_KEY:latest \
            --update-secrets OPENAI_API_KEY=OPENAI_API_KEY:latest \
            --update-secrets GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest \
            --update-secrets GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest \
            --update-secrets JWT_SECRET=JWT_SECRET:latest \
            --update-secrets DODO_PAYMENTS_API_KEY=DODO_PAYMENTS_API_KEY:latest \
            --update-secrets DODO_PAYMENTS_WEBHOOK_SECRET=DODO_PAYMENTS_WEBHOOK_SECRET:latest \
            --update-secrets DODO_PRODUCT_ID_INDIA=DODO_PRODUCT_ID_INDIA:latest \
            --update-secrets DODO_PRODUCT_ID_GLOBAL=DODO_PRODUCT_ID_GLOBAL:latest || echo "US deployment skipped - may need setup"

      # ── OCR v2 service (Node/TypeScript, sharp-based pipeline) ──
      # Separate Cloud Run service so the OCR pipeline scales
      # independently of the main Go backend. Runs in asia-south1 only
      # for now — most OCR traffic is Indian, US latency isn't
      # user-facing since /api/ocr-v2/* proxies through Express which
      # already picks the nearest backend.
      #
      # min-instances=0 to keep cold-start cost down while the beta is
      # small. Bump to 1 when traffic warrants it. Concurrency=10 per
      # instance since each OCR request is I/O-bound on Gemini calls.
      - name: Build OCR v2 Image
        run: |
          docker build \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/docker-repo/ocr-v2:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/docker-repo/ocr-v2:latest \
            -f services/ocr-v2/Dockerfile \
            services/ocr-v2

      - name: Push OCR v2 Image
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/docker-repo/ocr-v2:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/docker-repo/ocr-v2:latest

      - name: Deploy OCR v2 to Cloud Run
        # Gemini key is passed from GitHub Actions repo secrets
        # (secrets.GOOGLE_GENAI_API_KEY) as a plain env var — same
        # source pattern the rest of the workflow uses for RESEND_API_KEY,
        # SMTP_PASSWORD, etc. Server reads GEMINI_API_KEY first, then
        # GOOGLE_GENAI_API_KEY as fallback, so mapping to either works.
        # If you later want to migrate to Secret Manager, swap this line
        # for --update-secrets GEMINI_API_KEY=<secret_name>:latest.
        run: |
          gcloud run deploy prooftamil-ocr-v2 \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/docker-repo/ocr-v2:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --memory=2Gi \
            --cpu=2 \
            --timeout=120 \
            --min-instances=0 \
            --max-instances=20 \
            --concurrency=10 \
            --port=8080 \
            --set-env-vars=NODE_ENV=production,OCR_V2_MODEL=gemini-2.5-flash,GEMINI_API_KEY=${{ secrets.GOOGLE_GENAI_API_KEY }}

      - name: Verify Backend Health (Both Regions)
        run: |
          sleep 10
          echo "=== Asia South (Mumbai) ==="
          BACKEND_URL=$(gcloud run services describe prooftamil-backend --region=${{ env.REGION }} --format='value(status.url)')
          echo "Backend URL: $BACKEND_URL"
          curl -f "$BACKEND_URL/health" || echo "Health check pending..."

          echo ""
          echo "=== US Central ==="
          BACKEND_URL_US=$(gcloud run services describe prooftamil-backend-us --region=us-central1 --format='value(status.url)' 2>/dev/null) || echo "US backend not yet deployed"
          if [ -n "$BACKEND_URL_US" ]; then
            echo "Backend URL (US): $BACKEND_URL_US"
            curl -f "$BACKEND_URL_US/health" || echo "US health check pending..."
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: express-frontend
        run: |
          npm config set registry https://registry.npmjs.org
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-timeout 600000
          for i in 1 2 3; do
            npm ci && break
            echo "npm ci failed (attempt $i), retrying in 10s..."
            sleep 10
          done
          npm list tailwindcss || npm install tailwindcss

      - name: Build frontend assets
        working-directory: express-frontend
        run: npm run build:css

      - name: Check Vercel credentials
        run: |
          if [ -z "${VERCEL_TOKEN}" ] || [ -z "${VERCEL_ORG_ID}" ] || [ -z "${VERCEL_PROJECT_ID}" ]; then
            echo "Missing Vercel secrets. Ensure VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID are set in GitHub secrets."
            exit 1
          fi

      # Automatically sync the freshly-deployed Cloud Run URLs into Vercel's
      # production environment so the frontend always routes to the right backend.
      # Uses the Vercel CLI (not the REST API) so VERCEL_ORG_ID / VERCEL_PROJECT_ID
      # are resolved correctly regardless of whether they are stored as slugs or IDs.
      - name: Sync Cloud Run URLs to Vercel environment
        run: |
          # Prefer explicit GitHub secrets (CLOUD_RUN_URL_ASIA / CLOUD_RUN_URL_US) so the
          # stable project-number URLs are used instead of the auto-generated hash URLs that
          # `gcloud run services describe` may return (e.g. *-aspwcdiala-el.a.run.app vs
          # *-991187041222.asia-south1.run.app).  Fall back to gcloud if secrets are absent.
          if [ -n "$CLOUD_RUN_URL_ASIA" ]; then
            ASIA_URL="$CLOUD_RUN_URL_ASIA"
          else
            ASIA_URL=$(gcloud run services describe prooftamil-backend \
              --region=asia-south1 --format='value(status.url)')
          fi

          if [ -n "$CLOUD_RUN_URL_US" ]; then
            US_URL="$CLOUD_RUN_URL_US"
          else
            US_URL=$(gcloud run services describe prooftamil-backend-us \
              --region=us-central1 --format='value(status.url)' 2>/dev/null || echo "")
          fi

          echo "Asia backend: $ASIA_URL"
          echo "US backend:   ${US_URL:-not deployed}"

          if [ -z "$ASIA_URL" ]; then
            echo "ERROR: Asia backend URL not found"
            exit 1
          fi

          npm install --global vercel@latest --quiet

          # Set/overwrite a Vercel production env var using the CLI.
          # vercel env rm removes only the production target (ignores error if absent).
          # vercel env add reads value from stdin; --yes skips any confirmation prompt.
          set_env() {
            local KEY="$1" VALUE="$2"
            echo "  Setting $KEY"
            vercel env rm "$KEY" production \
              --token="$VERCEL_TOKEN" --yes 2>/dev/null || true
            printf '%s' "$VALUE" | \
              vercel env add "$KEY" production \
              --token="$VERCEL_TOKEN" --yes
            echo "  Done: $KEY"
          }

          set_env BACKEND_URL_ASIA "$ASIA_URL"

          if [ -n "$US_URL" ]; then
            set_env BACKEND_URL_US      "$US_URL"
            # BACKEND_URL_PRIMARY is the fixed OAuth callback URL — always US.
            set_env BACKEND_URL_PRIMARY "$US_URL"
          fi

          # OCR v2 Cloud Run service URL — the Express /api/ocr-v2/*
          # proxy uses this to forward requests. Optional: falls back
          # to no OCR v2 proxy if the service isn't deployed yet.
          OCR_V2_URL=$(gcloud run services describe prooftamil-ocr-v2 \
            --region=asia-south1 --format='value(status.url)' 2>/dev/null || echo "")
          if [ -n "$OCR_V2_URL" ]; then
            set_env OCR_V2_URL "$OCR_V2_URL"
          fi

          # OCR v2 beta allowlist — comma-separated emails that see the
          # new pipeline UI at /tools/handwriting-ocr. Everyone else
          # still sees the maintenance page. Expand this list as we
          # roll out to more users.
          set_env OCR_V2_BETA_EMAILS "contact@prooftamil.com"

          echo "Vercel env vars synced."
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # Optional overrides — set these in GitHub secrets to pin the stable
          # project-number Cloud Run URLs instead of relying on gcloud output.
          CLOUD_RUN_URL_ASIA: ${{ secrets.CLOUD_RUN_URL_ASIA }}
          CLOUD_RUN_URL_US: ${{ secrets.CLOUD_RUN_URL_US }}

      - name: Deploy Frontend to Vercel
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel deploy --prod --token=$VERCEL_TOKEN --yes --force
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deployment Complete
        run: |
          echo "Deployment Complete"
          echo "Backend (Cloud Run): $(gcloud run services describe prooftamil-backend --region=${{ env.REGION }} --format='value(status.url)')"
          echo "Frontend: Deployed via Vercel"
