<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR Tool - Image to Text Converter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
            font-size: 32px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }
        
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }
        
        .upload-area:hover {
            background: #f0f2ff;
            border-color: #764ba2;
        }
        
        .upload-area.dragover {
            background: #e8ebff;
            border-color: #764ba2;
            transform: scale(1.02);
        }
        
        .upload-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }
        
        .upload-text {
            color: #667eea;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .upload-hint {
            color: #999;
            font-size: 14px;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .result-area {
            display: none;
            margin-top: 30px;
            padding: 25px;
            background: #f8f9ff;
            border-radius: 15px;
        }
        
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .result-title {
            color: #667eea;
            font-size: 20px;
            font-weight: 600;
        }
        
        .result-stats {
            color: #999;
            font-size: 14px;
        }
        
        .result-text {
            background: white;
            padding: 20px;
            border-radius: 10px;
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 20px;
            line-height: 1.8;
            color: #333;
            white-space: pre-wrap;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: #667eea;
            font-size: 18px;
            font-weight: 600;
        }
        
        .error {
            background: #ffe6e6;
            color: #d32f2f;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
        
        .success {
            background: #e6f7e6;
            color: #2e7d32;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }
        
        .file-info {
            display: none;
            background: #e8ebff;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            color: #667eea;
        }
        
        .supported-formats {
            text-align: center;
            margin-top: 20px;
            color: #999;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 OCR Tool</h1>
        <p class="subtitle">Extract text from images and PDFs • Convert to Word format</p>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📄</div>
            <div class="upload-text">Click to upload or drag and drop</div>
            <div class="upload-hint">Supports: JPG, PNG, PDF, TIFF (Max 16MB)</div>
            <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.pdf,.tiff,.bmp,.gif">
        </div>
        
        <div class="file-info" id="fileInfo"></div>
        
        <div style="text-align: center;">
            <button class="btn" id="processBtn" disabled>🚀 Extract Text</button>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div class="loading-text">Extracting text... Please wait</div>
        </div>
        
        <div class="error" id="error"></div>
        
        <div class="result-area" id="resultArea">
            <div class="result-header">
                <div class="result-title">✨ Extracted Text</div>
                <div class="result-stats" id="stats"></div>
            </div>
            <div class="result-text" id="resultText"></div>
            <div style="text-align: center;">
                <button class="btn" id="downloadBtn">📥 Download Word Document</button>
            </div>
        </div>
        
        <div class="supported-formats">
            Powered by Tesseract OCR • Free & Open Source
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const processBtn = document.getElementById('processBtn');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const resultArea = document.getElementById('resultArea');
        const resultText = document.getElementById('resultText');
        const stats = document.getElementById('stats');
        const downloadBtn = document.getElementById('downloadBtn');
        const fileInfo = document.getElementById('fileInfo');
        
        let selectedFile = null;
        let downloadFilename = null;
        
        // Click to upload
        uploadArea.addEventListener('click', () => fileInput.click());
        
        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFileSelect(files[0]);
            }
        });
        
        // File selection
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelect(e.target.files[0]);
            }
        });
        
        function handleFileSelect(file) {
            selectedFile = file;
            processBtn.disabled = false;
            error.style.display = 'none';
            resultArea.style.display = 'none';
            
            const fileSize = (file.size / 1024 / 1024).toFixed(2);
            fileInfo.innerHTML = `📎 Selected: <strong>${file.name}</strong> (${fileSize} MB)`;
            fileInfo.style.display = 'block';
        }
        
        // Process file
        processBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            
            const formData = new FormData();
            formData.append('file', selectedFile);
            
            loading.style.display = 'block';
            processBtn.disabled = true;
            error.style.display = 'none';
            resultArea.style.display = 'none';
            
            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                loading.style.display = 'none';
                
                if (data.error) {
                    error.textContent = '❌ Error: ' + data.error;
                    error.style.display = 'block';
                    processBtn.disabled = false;
                } else {
                    resultText.textContent = data.text;
                    stats.textContent = `${data.char_count} characters extracted`;
                    downloadFilename = data.download_filename;
                    resultArea.style.display = 'block';
                }
            } catch (err) {
                loading.style.display = 'none';
                error.textContent = '❌ Error: ' + err.message;
                error.style.display = 'block';
                processBtn.disabled = false;
            }
        });
        
        // Download
        downloadBtn.addEventListener('click', () => {
            if (downloadFilename) {
                window.location.href = `/download/${downloadFilename}`;
            }
        });
    </script>
</body>
</html>
