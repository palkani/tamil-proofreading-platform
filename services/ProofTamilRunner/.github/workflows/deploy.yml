name: Deploy to Cloud Run

on:
  push:
    branches: [ "main" ]
    paths:
      - 'services/ProofTamilRunner/**'
  workflow_dispatch:  # Allow manual trigger

env:
  SERVICE: prooftamil-runner
  REGION: us-central1
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ProofTamilRunner
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker auth
        run: gcloud auth configure-docker

      - name: Build and push image
        run: |
          IMAGE=gcr.io/${PROJECT_ID}/${SERVICE}:${{ github.sha }}
          gcloud builds submit --tag "$IMAGE" .
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE \
            --image ${{ env.IMAGE }} \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --timeout 60 \
            --concurrency 80 \
            --set-env-vars "API_KEY_SECRET=${{ secrets.API_KEY_SECRET }},API_KEY=${{ secrets.API_KEY }},CLIENT_ID=${{ secrets.CLIENT_ID }},RATE_LIMIT_PER_MIN=${{ secrets.RATE_LIMIT_PER_MIN || '120' }},MAX_TEXT_LEN=${{ secrets.MAX_TEXT_LEN || '64' }}"

      - name: Show deployment URL
        run: |
          gcloud run services describe $SERVICE --region $REGION --format 'value(status.url)'
