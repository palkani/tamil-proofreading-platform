# Blog topic queue for the scheduled publishing system.
#
# How it works:
#   1. The generator script (`express-frontend/scripts/generate-scheduled-blog.js`)
#      picks the FIRST topic with `status: queued`.
#   2. It calls the AI Content Writer with the topic, target keyword, and
#      suggested internal links to produce a draft.
#   3. A quality gate validates word count, keyword presence, internal-link
#      count, and heading structure.
#   4. If it passes, the draft is posted to the backend with `status: draft`
#      so you can review in the admin UI before publishing.
#   5. The topic's status here is updated to `generated` with a timestamp.
#
# Topic order matters — the script processes top-to-bottom. Tier 2
# (Tholkappiyam) and Tier 1 (commercial intent) are interleaved so the
# alternating cadence the user requested falls out naturally.
#
# To add a topic: append a block at the bottom of the `queue:` list with
# `status: queued`. To pause one: change its status to `paused`. To remove
# one: delete it.
#
# Tiers:
#   1 = commercial intent (high value, drives conversions)
#   2 = Tholkappiyam series (topical authority)
#   3 = tutorials / how-to / comparisons (long-tail traffic)

queue:
