  # These three target "document I need to produce NOW" intent — readers
  # searching "tamil resignation letter format" need a ready template, not an
  # informational essay. Each post should end with a clear "Open this template
  # in the ProofTamil editor" CTA so reading converts directly into tool use.
  # Tier 1 because the conversion path is unusually short (search → template →
  # editor draft → grammar check → save → signup prompt).

